<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to exedee.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://exedee.com/">
  <meta http-equiv="refresh" content="0; url=https://exedee.com/">
  <script>
    // Keep the path, query string and hash so deep links land on the same page
    var target = "https://exedee.com" + location.pathname + location.search + location.hash;
    location.replace(target);
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 0 16px; background: #fff; color: #222; }
    a { color: #0066cc; }
  </style>
</head>
<body>
  <p>This site has moved to <a href="https://exedee.com/">exedee.com</a>.</p>
</body>
</html>
